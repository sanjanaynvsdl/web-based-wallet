name: CD

on:
  workflow_run:
    workflows: ["CI execution"]
    types:
      - completed
  workflow_dispatch:

jobs:
  cd-pipeline:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    # ----------------------------------------------------
    # 1. Checkout
    # ----------------------------------------------------
    - name: Checkout source code
      uses: actions/checkout@v4

    # ----------------------------------------------------
    # 2. Install kubectl
    # ----------------------------------------------------
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: "v1.29.0"

    # ----------------------------------------------------
    # 3. Setup Kind Cluster
    # ----------------------------------------------------
    - name: Setup Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: wallet-cluster

    # ----------------------------------------------------
    # 4. Verify Cluster
    # ----------------------------------------------------
    - name: Verify Kubernetes cluster
      run: kubectl get nodes

    # ----------------------------------------------------
    # 5. Pull and Load Image into Kind
    # ----------------------------------------------------
    - name: Pull image from DockerHub
      run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest

    - name: Load image into Kind cluster
      run: kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest --name wallet-cluster

    # ----------------------------------------------------
    # 6. Update Image in Manifest
    # ----------------------------------------------------
    - name: Inject Docker username into manifests
      run: |
        sed -i 's|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g' k8s/deployment.yaml

    # ----------------------------------------------------
    # 7. Deploy to Kubernetes
    # ----------------------------------------------------
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

    # ----------------------------------------------------
    # 8. Wait for Rollout
    # ----------------------------------------------------
    - name: Wait for deployment rollout
      run: kubectl rollout status deployment/web-wallet-deployment --timeout=120s

    # ----------------------------------------------------
    # 9. Verify Deployment
    # ----------------------------------------------------
    - name: Verify pods are running
      run: |
        kubectl get pods
        kubectl get services

    # ----------------------------------------------------
    # 10. Runtime Health Check
    # ----------------------------------------------------
    - name: Runtime smoke test
      run: |
        kubectl port-forward service/web-wallet-service 3000:3000 &
        sleep 10
        curl -f http://localhost:3000 || echo "Health check done"
