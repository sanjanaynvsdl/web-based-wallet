name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # 1. Checkout
      # ----------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js Runtime
      # ----------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install Dependencies
      # ----------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # 4. Linting (ESLint)
      # ----------------------------------------------------
      - name: Run ESLint (Linting)
        run: npm run lint
        continue-on-error: true

      # 5. SAST - CodeQL
      # ----------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 6. SCA - Dependency Vulnerability Scan
      # ----------------------------------------------------
      - name: Run npm audit (SCA)
        run: npm audit --audit-level=high
        continue-on-error: true

      # 7. Unit Tests
      # ----------------------------------------------------
      - name: Run Unit Tests
        run: npm test --if-present
        continue-on-error: true

      # 8. Build Application
      # ----------------------------------------------------
      - name: Build with npm
        run: npm run build

      # 9. Docker Build
      # ----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest .

      # 10. Trivy - Container Image Security Scan
      # ----------------------------------------------------
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # 11. Docker Container Runtime Test
      # ----------------------------------------------------
      - name: Run container and test
        run: |
          docker run -d -p 3000:3000 --name test-app ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest
          sleep 15
          curl -f http://localhost:3000 || exit 1
          docker logs test-app
          docker stop test-app
          docker rm test-app

      # 12. Login to DockerHub
      # ----------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 13. Push Docker Image
      # ----------------------------------------------------
      - name: Push Image to DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/web-based-wallet:latest
